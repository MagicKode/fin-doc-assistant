spring:
  application:
    name: fin-doc-assistant

  # AI: OpenAI
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.2

  #  Data base
  datasource:
    url: jdbc:postgresql://localhost:5433/fin_assistant
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Логирование
logging:
  level:
    root: info
    com.fin.doc: DEBUG
    org.springframework.ai: DEBUG # видеть, что происходит внутри Spring AI

